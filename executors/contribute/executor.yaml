{
  "schema_version": 1,
  "id": "hivemind.contribute",
  "name": "Contribute",
  "kind": "external",
  "version": "3.0",
  "short_description": "Submit and review immutable Hivemind resource revisions, evidence, and legacy contributions.",
  "description": "Builds locked contribution envelopes and POSTs them to the single contribute edge function with X-Contributor-Key auth. Knowledge-model writes use full candidate content, exact decimal-string IDs, caller-scoped idempotency tokens, and trusted transactional approval. Supports --dry-run.",
  "keywords": [
    "hivemind",
    "contribute",
    "submit",
    "resource",
    "distillation",
    "edge-function"
  ],
  "inputs": [
    {
      "name": "type",
      "type": "string",
      "required": true,
      "description": "What to contribute: resource | distillation | submit-resource | propose-revision | decide-revision | mark-canonical | capture-message | evidence."
    },
    {
      "name": "kind",
      "type": "string",
      "required": false,
      "description": "kind"
    },
    {
      "name": "title",
      "type": "string",
      "required": false,
      "description": "title"
    },
    {
      "name": "body_file",
      "type": "string",
      "required": false,
      "description": "body file"
    },
    {
      "name": "source",
      "type": "string",
      "required": false,
      "description": "source"
    },
    {
      "name": "url",
      "type": "string",
      "required": false,
      "description": "url"
    },
    {
      "name": "author",
      "type": "string",
      "required": false,
      "description": "author"
    },
    {
      "name": "question",
      "type": "string",
      "required": false,
      "description": "question"
    },
    {
      "name": "answer",
      "type": "string",
      "required": false,
      "description": "answer"
    },
    {
      "name": "confidence",
      "type": "string",
      "required": false,
      "description": "confidence"
    },
    {
      "name": "cites",
      "type": "string",
      "required": false,
      "description": "Comma-separated cites, e.g. message:88123,resource:17."
    },
    {
      "name": "supersedes",
      "type": "number",
      "required": false,
      "description": "supersedes"
    },
    {
      "name": "conditions",
      "type": "string",
      "required": false,
      "description": "conditions"
    },
    {
      "name": "idempotency_token",
      "type": "string",
      "required": false,
      "description": "Caller-scoped retry token; required for knowledge-model writes."
    },
    {"name": "resource_id", "type": "string", "required": false, "description": "Stable resource ID."},
    {"name": "base_revision_id", "type": "string", "required": false, "description": "Accepted head used as the proposal base."},
    {"name": "revision_id", "type": "string", "required": false, "description": "Revision to decide."},
    {"name": "decision", "type": "string", "required": false, "description": "accepted | rejected | withdrawn."},
    {"name": "canonical", "type": "boolean", "required": false, "description": "Set the canonical-guide marker."},
    {"name": "uncanonical", "type": "boolean", "required": false, "description": "Clear the canonical-guide marker."},
    {"name": "payload_file", "type": "string", "required": false, "description": "JSON file containing the native payload."},
    {"name": "metadata_file", "type": "string", "required": false, "description": "JSON file containing revision metadata."},
    {"name": "provenance_file", "type": "string", "required": false, "description": "JSON file containing revision provenance."},
    {"name": "references_file", "type": "string", "required": false, "description": "JSON array of typed references."},
    {"name": "claim", "type": "string", "required": false, "description": "Evidence claim."},
    {"name": "reported_result", "type": "string", "required": false, "description": "Evidence result."},
    {"name": "basis", "type": "string", "required": false, "description": "reported | observed."},
    {"name": "subjects_file", "type": "string", "required": false, "description": "JSON array of exact evidence subjects."},
    {"name": "sources_file", "type": "string", "required": false, "description": "JSON array of typed sources or ordinary URLs."},
    {"name": "supersedes_evidence", "type": "string", "required": false, "description": "Evidence ID being corrected."},
    {"name": "message_id", "type": "string", "required": false, "description": "Observed source message ID."},
    {"name": "content", "type": "string", "required": false, "description": "Observed message content."},
    {"name": "source_metadata_file", "type": "string", "required": false, "description": "JSON object of observed message metadata."},
    {"name": "original_author_id", "type": "string", "required": false, "description": "Original message author ID."},
    {"name": "original_author_name", "type": "string", "required": false, "description": "Original message author name."},
    {
      "name": "from_file",
      "type": "string",
      "required": false,
      "description": "Read the full payload from a JSON file."
    },
    {
      "name": "dry_run",
      "type": "boolean",
      "required": false,
      "description": "Print the request envelope without sending."
    }
  ],
  "outputs": [
    {
      "name": "result",
      "type": "file",
      "path_template": "{out}/result.json"
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "hivemind.executors.contribute.run",
      "--type",
      "{type}",
      "--out",
      "{out}/result.json"
    ],
    "input_args": [
      {"input": "kind", "flag": "--kind", "optional": true},
      {"input": "title", "flag": "--title", "optional": true},
      {"input": "body_file", "flag": "--body-file", "optional": true},
      {"input": "source", "flag": "--source", "optional": true},
      {"input": "url", "flag": "--url", "optional": true},
      {"input": "author", "flag": "--author", "optional": true},
      {"input": "question", "flag": "--question", "optional": true},
      {"input": "answer", "flag": "--answer", "optional": true},
      {"input": "confidence", "flag": "--confidence", "optional": true},
      {"input": "cites", "flag": "--cites", "optional": true},
      {"input": "supersedes", "flag": "--supersedes", "optional": true},
      {"input": "conditions", "flag": "--conditions", "optional": true},
      {"input": "idempotency_token", "flag": "--idempotency-token", "optional": true},
      {"input": "resource_id", "flag": "--resource-id", "optional": true},
      {"input": "base_revision_id", "flag": "--base-revision-id", "optional": true},
      {"input": "revision_id", "flag": "--revision-id", "optional": true},
      {"input": "decision", "flag": "--decision", "optional": true},
      {"input": "canonical", "flag": "--canonical", "optional": true},
      {"input": "uncanonical", "flag": "--uncanonical", "optional": true},
      {"input": "payload_file", "flag": "--payload-file", "optional": true},
      {"input": "metadata_file", "flag": "--metadata-file", "optional": true},
      {"input": "provenance_file", "flag": "--provenance-file", "optional": true},
      {"input": "references_file", "flag": "--references-file", "optional": true},
      {"input": "claim", "flag": "--claim", "optional": true},
      {"input": "reported_result", "flag": "--reported-result", "optional": true},
      {"input": "basis", "flag": "--basis", "optional": true},
      {"input": "subjects_file", "flag": "--subjects-file", "optional": true},
      {"input": "sources_file", "flag": "--sources-file", "optional": true},
      {"input": "supersedes_evidence", "flag": "--supersedes-evidence", "optional": true},
      {"input": "message_id", "flag": "--message-id", "optional": true},
      {"input": "content", "flag": "--content", "optional": true},
      {"input": "source_metadata_file", "flag": "--source-metadata-file", "optional": true},
      {"input": "original_author_id", "flag": "--original-author-id", "optional": true},
      {"input": "original_author_name", "flag": "--original-author-name", "optional": true},
      {"input": "from_file", "flag": "--from-file", "optional": true},
      {"input": "dry_run", "flag": "--dry-run", "optional": true}
    ]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "env_passthrough": [
      "HIVEMIND_API_URL",
      "HIVEMIND_CONTRIBUTOR_KEY"
    ]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "hivemind.executors.contribute.run"
    ,"network_policy": {"allowed_protocols": ["dns", "tcp"], "allowed_destinations": ["https://ujlwuvkrxlvoswwkerdf.supabase.co:443"], "allow_redirects": false, "broker": {"host_managed": true}}
  }
}
