{
  "schema_version": 1,
  "id": "hivemind.get_item",
  "name": "Get Item",
  "kind": "external",
  "version": "2.0",
  "short_description": "Fetch a single full row from the Hivemind corpus by kind and id.",
  "description": "Retrieves a full message, current stable resource, or exact pinned resource revision and its knowledge-reference context.",
  "keywords": [
    "hivemind",
    "get",
    "fetch",
    "corpus",
    "cite"
  ],
  "inputs": [
    {"name": "kind", "type": "string", "required": true, "description": "Item kind: message | resource | revision."},
    {"name": "id", "type": "string", "required": true, "description": "Decimal ID, kept as text at JSON boundaries."},
    {"name": "revision_id", "type": "string", "required": false, "description": "Exact revision to fetch for a resource."}
  ],
  "outputs": [
    {
      "name": "item",
      "type": "file",
      "path_template": "{out}/item.json"
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "hivemind.executors.get_item.run",
      "--kind",
      "{kind}",
      "--id",
      "{id}",
      "--revision-id",
      "{revision_id}",
      "--out",
      "{out}/item.json"
    ],
    "input_args": [{"input": "revision_id", "flag": "--revision-id", "optional": true}]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "env_passthrough": [
      "HIVEMIND_API_URL",
      "HIVEMIND_ANON_KEY"
    ]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "hivemind.executors.get_item.run"
    ,"network_policy": {"allowed_protocols": ["dns", "tcp"], "allowed_destinations": ["https://ujlwuvkrxlvoswwkerdf.supabase.co:443"], "allow_redirects": false, "broker": {"host_managed": true}}
  }
}
