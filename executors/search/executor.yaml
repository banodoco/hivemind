schema_version: 1
id: hivemind.search
name: Search
kind: external
version: '2.0'
short_description: Search Discord messages and accepted current resource heads with per-token matching and client-side ranking.
description: 'Searches message_feed and resources joined to their current accepted resource_revisions with per-token ILIKE predicates. Pending and historical revisions are excluded; text search never uses unified_feed. Filters include kind/source/date/channel/author/thread and pagination.'
keywords:
- hivemind
- search
- corpus
- message_feed
- resources
- postgrest
- resource_revisions
inputs:
- name: query
  type: string
  required: true
  description: Search query (per-token matched across messages and accepted current resource revisions).
- name: kinds
  type: string
  required: false
  description: Comma-separated kind filter (message,resource,article,workflow,transcript,...).
- name: sources
  type: string
  required: false
  description: Comma-separated source filter.
- name: since
  type: string
  required: false
  description: ISO timestamp lower bound for created_at.
- name: channel
  type: string
  required: false
  description: Discord channel name; searches messages in that channel only (e.g. wan_chatter). Message surface only.
- name: author
  type: string
  required: false
  description: Discord author display name; searches that author's messages only (e.g. Kijai). Message surface only.
- name: thread
  type: string
  required: false
  description: Discord thread id (snowflake); searches messages in that thread only (index-backed message_filters surface).
- name: limit
  type: number
  required: false
  description: Max results per page (default 20).
- name: offset
  type: number
  required: false
  description: Skip this many ranked results; page through a query with --limit + --offset. The response carries total/has_more. The ranked pool is deterministic while the corpus is unchanged (page N is stable across calls).
- name: sort
  type: string
  required: false
  description: 'relevance (default: score, then recency, then table+id) or recent (created_at desc, then score).'
outputs:
- name: results
  type: file
  path_template: '{out}/results.json'
  description: 'Paging contract: response JSON carries results[], count, total (ranked-pool extent), has_more, page, pages, next_offset. When has_more is true, fetch the next page by re-running with --offset <next_offset> (next_offset is null when has_more is false). Ranking is deterministic while the corpus is unchanged, so a page is stable across calls. A human summary prints to stderr; stdout is pure JSON.'
command:
  argv:
  - '{python_exec}'
  - -m
  - hivemind.executors.search.run
  - --query
  - '{query}'
  - --out
  - '{out}/results.json'
  input_args:
  - input: kinds
    flag: --kinds
    optional: true
  - input: sources
    flag: --sources
    optional: true
  - input: since
    flag: --since
    optional: true
  - input: channel
    flag: --channel
    optional: true
  - input: author
    flag: --author
    optional: true
  - input: thread
    flag: --thread
    optional: true
  - input: limit
    flag: --limit
    optional: true
  - input: offset
    flag: --offset
    optional: true
  - input: sort
    flag: --sort
    optional: true
cache:
  mode: none
isolation:
  mode: subprocess
  network: true
  env_passthrough:
  - HIVEMIND_API_URL
  - HIVEMIND_ANON_KEY
metadata:
  runtime_entrypoint: main
  runtime_file: run.py
  runtime_module: hivemind.executors.search.run
  network_policy:
    allowed_protocols: [dns, tcp]
    allowed_destinations: [https://ujlwuvkrxlvoswwkerdf.supabase.co:443]
    allow_redirects: false
    broker:
      host_managed: true
