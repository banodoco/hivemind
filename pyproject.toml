[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "2.0.0"
description = "Banodoco Hivemind — public knowledge corpus client: search messages/resources/distillations, fetch rows, refresh media URLs, and contribute via the locked edge-function write path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["hivemind", "banodoco", "corpus", "search", "postgrest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
hivemind-search = "hivemind.executors.search.run:main"

# The project root IS the ``hivemind`` package (repo-root __init__.py), so the
# package-dir mapping anchors it at "."; subpackages resolve relative to it.
[tool.setuptools]
packages = [
    "hivemind",
    "hivemind.executors",
    "hivemind.executors.search",
    "hivemind.executors.get_item",
    "hivemind.executors.refresh_media",
    "hivemind.executors.contribute",
    "hivemind.executors.ingest_article",
    "hivemind.executors.ingest_workflow",
    "hivemind.executors.ingest_youtube",
]

[tool.setuptools.package-dir]
hivemind = "."
